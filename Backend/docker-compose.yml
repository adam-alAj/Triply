# Backend/docker-compose.yml
# Run everything with:  docker compose up --build
# Stop with:            docker compose down
# Wipe the DB volume:   docker compose down -v

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: triply-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./Triply.Api
      dockerfile: Dockerfile
    container_name: triply-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Double underscore ("__") is how ASP.NET Core maps env vars to nested
      # config keys, e.g. ConnectionStrings:Default -> ConnectionStrings__Default.
      ConnectionStrings__Default: "Server=db;Database=TriplyDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: Triply
      Jwt__Audience: TriplyClients
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    # If the API starts a moment before SQL Server finishes accepting
    # connections, Program.cs's Database.Migrate() call can fail on first
    # boot. Auto-restarting a couple of times covers that race harmlessly.
    restart: on-failure:5

volumes:
  sqlserver_data:
