name: Backend CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Backend/Triply.Api/Triply.Api.csproj

      - name: Build
        run: dotnet build Backend/Triply.Api/Triply.Api.csproj --no-restore --configuration Release

      # Placeholder — enable once the xUnit/Moq test project exists (Testing & QA phase)
      # - name: Test
      #   run: dotnet test Backend/Triply.Api.Tests --no-build --configuration Release

      # Placeholder — deploy step, pending hosting decision (SRS D3)
