name: Backend CI

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - "backend/**"
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Triply-CI-Sql-Server-123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Triply-CI-Sql-Server-123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      TRIPLY_TEST_DB_CONNECTION: >-
        Server=localhost,1433;Database=TriplyDb_CI;User Id=sa;Password=Triply-CI-Sql-Server-123!;TrustServerCertificate=True;Encrypt=False

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.316

      - name: Restore
        working-directory: Backend
        run: dotnet restore Triply.Api.Tests/Triply.Api.Tests.csproj

      - name: Build
        working-directory: Backend
        run: dotnet build Triply.Api.Tests/Triply.Api.Tests.csproj --configuration Release --no-restore

      - name: Test with coverage
        working-directory: Backend
        run: >-
          dotnet test Triply.Api.Tests/Triply.Api.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            Backend/Triply.Api.Tests/TestResults/**/*.trx
            Backend/Triply.Api.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
